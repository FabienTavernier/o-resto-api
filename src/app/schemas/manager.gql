type Manager {
  # propriétés qui proviennent de la table manager
  id: Int!
  email: String!
  firstName: String!
  lastName: String!
  # association → je veux récupérer un manager AVEC ses restaurants
  restaurants: [Restaurant!]!
}

input CreateManagerInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
}

# Pour la modification, je permets de n'envoyer
# que certaines données : uniquement celle(s) à modifier
# → ~ PATCH (sous REST)
input UpdateManagerInput {
  email: String
  password: String
  first_name: String
  last_name: String
}
