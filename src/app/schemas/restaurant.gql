type Restaurant {
  id: Int!
  name: String!
  description: String!
  terrace: Boolean!
  rating: Float!
  ratingCount: Int!
  manager: Manager!
  city: City!
  cuisines: [Cuisine!]!
}

input CreateRestaurantInput {
  name: String!
  description: String!
  terrace: Boolean!
  manager_id: Int!
  city_id: Int!
}

input UpdateRestaurantInput {
  name: String
  description: String
  terrace: Boolean
  manager_id: Int
  city_id: Int
}
